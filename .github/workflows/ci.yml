name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFTFORMAT_VERSION: 0.59.1

jobs:
  macos:
    name: swift test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      # 严格并发检查下零警告：出现 warning 即失败。
      - name: Build with strict concurrency
        run: |
          swift build -Xswiftc -strict-concurrency=complete 2>&1 | tee build.log
          ! grep -E "warning:" build.log
      - name: Test
        run: swift test

  ios:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 只从 xcodebuild 认可的目的地里选；CoreSimulator 首次唤起可能返回空列表，重试后回退到 simctl。
      - name: Resolve simulator
        id: sim
        run: |
          UDID=""
          for attempt in 1 2 3 4 5; do
            DEST=$(xcodebuild -scheme TolerantCodable -showdestinations 2>/dev/null \
              | grep "platform:iOS Simulator" | grep "name:iPhone" | grep -v "placeholder" | head -1 || true)
            if [ -n "$DEST" ]; then
              UDID=$(echo "$DEST" | sed -E 's/.*id:([0-9A-F-]+).*/\1/')
              break
            fi
            sleep 10
          done
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available -j \
              | python3 -c "import sys, json; d = json.load(sys.stdin)['devices']; ids = [dev['udid'] for rt, devs in d.items() if 'iOS' in rt for dev in devs if dev['name'].startswith('iPhone')]; print(ids[-1] if ids else '')")
          fi
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          xcodebuild test \
            -scheme TolerantCodable \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
        env:
          NSUnbufferedIO: YES

  examples:
    name: Build Examples (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # 只编译示例工程，确认公开 API 改动后示例仍可用；UI 测试在本地运行。
      - name: Build example app
        run: |
          xcodebuild build \
            -project Examples/TolerantCodableExamples.xcodeproj \
            -scheme TolerantCodableExamples \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
        env:
          NSUnbufferedIO: YES

  lint:
    name: SwiftFormat
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned SwiftFormat
        run: |
          mkdir -p "$HOME/tools" && cd "$HOME/tools"
          curl -sSL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -q -o swiftformat.zip && chmod +x swiftformat
          echo "$HOME/tools" >> "$GITHUB_PATH"
      - name: SwiftFormat (lint)
        run: swiftformat --version && swiftformat --lint .
